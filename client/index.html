<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/orbit-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Orbit — a privacy-first social network. Chronological feed, encrypted-by-design chat, self-hosted. Break free. Stay connected." />
    <title>Orbit — Break free. Stay connected.</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong colour scheme.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('orbit-theme') || '{}');
          var theme = (stored && stored.state && stored.state.theme) || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
